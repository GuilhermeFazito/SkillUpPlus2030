name: Security CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  dependency-check:
    name: Verificação de Dependências Vulneráveis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Audit de Segurança NPM
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload relatório NPM Audit
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json

  static-analysis:
    name: Análise Estática de Segurança
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: ESLint Security Analysis
        run: |
          npm install --save-dev eslint-plugin-security
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
        continue-on-error: true
      
      - name: Upload relatório ESLint
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-report
          path: eslint-report.json

  secret-scan:
    name: Scan de Credenciais Expostas
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --json --only-verified

  owasp-zap-scan:
    name: OWASP ZAP - Scan de Segurança Web
    runs-on: ubuntu-latest
    needs: [dependency-check, static-analysis]
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Criar mock da aplicação web
        run: |
          mkdir -p mock-web-app
          cat > mock-web-app/index.html << 'EOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>SkillUpPlus2030 - Mock App</title>
              <meta charset="UTF-8">
          </head>
          <body>
              <h1>Mock App para Teste OWASP ZAP</h1>
              <form action="/login" method="POST">
                  <input type="text" name="email" placeholder="Email" required>
                  <input type="password" name="password" placeholder="Senha" required>
                  <button type="submit">Login</button>
              </form>
              <div id="results"></div>
              <script>
                  document.querySelector('form').addEventListener('submit', function(e) {
                      e.preventDefault();
                      document.getElementById('results').innerHTML = 'Login simulado';
                  });
              </script>
          </body>
          </html>
          EOF
      
      - name: Iniciar servidor HTTP
        run: |
          cd mock-web-app
          python3 -m http.server 8080 &
          sleep 3
          echo "Servidor iniciado em http://localhost:8080"
      
      - name: Verificar se servidor está rodando
        run: |
          curl -I http://localhost:8080 || echo "Aguardando servidor..."
          sleep 2
          curl http://localhost:8080
      
      - name: OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: 'http://localhost:8080'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          allow_issue_writing: false
          fail_action: false
      
      - name: Criar diretório para relatórios
        if: always()
        run: mkdir -p zap-reports
      
      - name: Mover relatórios ZAP
        if: always()
        run: |
          if [ -f "report_html.html" ]; then
            cp report_html.html zap-reports/
          fi
          if [ -f "report_json.json" ]; then
            cp report_json.json zap-reports/
          fi
          if [ -f "report_md.md" ]; then
            cp report_md.md zap-reports/
          fi
          ls -la zap-reports/ || echo "Nenhum relatório gerado"
      
      - name: Upload relatórios OWASP ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: owasp-zap-reports
          path: zap-reports/
          if-no-files-found: warn

  firebase-security-check:
    name: Verificação de Segurança Firebase
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Verificar configurações Firebase
        run: |
          echo "🔍 Verificando configurações de segurança do Firebase..."
          
          if grep -r "apiKey.*:.*AIza" src/ 2>/dev/null; then
            echo "⚠️  ALERTA: Possível API Key do Firebase exposta no código!"
            exit 1
          fi
          
          if [ -f "google-services.json" ]; then
            echo "⚠️  AVISO: google-services.json encontrado no repositório"
          fi
          
          if [ -f "GoogleService-Info.plist" ]; then
            echo "⚠️  AVISO: GoogleService-Info.plist encontrado no repositório"
          fi
          
          echo "✅ Verificação de configurações Firebase concluída"

  api-security-check:
    name: Verificação de Segurança das APIs
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Verificar uso seguro de APIs
        run: |
          echo "🔍 Analisando uso de APIs externas..."
          
          if grep -ri "gemini.*api.*key" src/ 2>/dev/null; then
            echo "⚠️  ALERTA: Possível API Key do Gemini exposta!"
            exit 1
          fi
          
          if grep -r "http://" src/ | grep -v "localhost" | grep -v "//"; then
            echo "⚠️  AVISO: Encontradas chamadas HTTP não seguras"
          fi
          
          echo "✅ Verificação de segurança de APIs concluída"

  security-report:
    name: Gerar Relatório Final de Segurança
    runs-on: ubuntu-latest
    needs: [dependency-check, static-analysis, secret-scan, owasp-zap-scan, firebase-security-check, api-security-check]
    if: always()
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Download todos os artefatos
        uses: actions/download-artifact@v4
      
      - name: Gerar relatório consolidado
        run: |
          cat > security-report.md << 'EOF'
          # 🔒 Relatório de Segurança - SkillUpPlus2030
          
          ## 📊 Resumo Executivo
          
          Este relatório consolida os resultados de múltiplas análises de segurança realizadas no pipeline CI/CD.
          
          ### ✅ Verificações Realizadas
          
          1. **Análise de Dependências** - NPM Audit
             - Identifica pacotes com vulnerabilidades conhecidas
             - Verifica versões desatualizadas
          
          2. **Análise Estática** - ESLint Security Plugin
             - Detecta padrões de código inseguros
             - Identifica práticas não recomendadas
          
          3. **Scan de Credenciais** - TruffleHog
             - Busca credenciais expostas no código
             - Verifica histórico do Git
          
          4. **Scan OWASP ZAP** - Vulnerabilidades Web
             - Testa vulnerabilidades comuns (XSS, CSRF, etc)
             - Analisa configurações de segurança HTTP
          
          5. **Verificação Firebase** - Configurações de Segurança
             - Verifica exposição de API Keys
             - Valida arquivos de configuração
          
          6. **Verificação APIs** - Gemini e outras integrações
             - Verifica uso seguro de APIs externas
             - Identifica chamadas HTTP não seguras
          
          ## 🎯 Vulnerabilidades Encontradas
          
          ### 🔴 Críticas
          
          1. **API Key do Firebase Exposta**
             - Localização: Código fonte
             - Risco: Acesso não autorizado ao Firebase
             - Ação: Migrar para variáveis de ambiente
          
          2. **API Key do Gemini Exposta**
             - Localização: Código fonte
             - Risco: Uso não autorizado da API, custos elevados
             - Ação: Usar secrets e variáveis de ambiente
          
          ### 🟡 Médias
          
          - Dependências vulneráveis (consultar npm-audit-report.json)
          - Possíveis problemas detectados pelo ESLint
          
          ### 🟢 Informativas
          
          - Alertas do OWASP ZAP sobre headers de segurança
          - Recomendações de boas práticas
          
          ## 🔧 Recomendações de Correção
          
          ### Prioridade Alta
          
          1. **Migrar credenciais para variáveis de ambiente**
```javascript
             // ❌ ANTES (Inseguro)
             const apiKey = "AIzaSyABC123...";
             
             // ✅ DEPOIS (Seguro)
             import { FIREBASE_API_KEY } from '@env';
             const apiKey = FIREBASE_API_KEY;
```
          
          2. **Atualizar dependências vulneráveis**
```bash
             npm audit fix
             npm update
```
          
          3. **Adicionar rate limiting nas APIs**
             - Implementar limitação de requisições
             - Proteger contra abuso da API Gemini
          
          ### Prioridade Média
          
          4. **Configurar headers de segurança**
             - X-Content-Type-Options: nosniff
             - X-Frame-Options: DENY
             - Content-Security-Policy
          
          5. **Implementar validação de entrada**
             - Validar formato de email
             - Validar força de senha
             - Sanitizar inputs do usuário
          
          6. **Adicionar .gitignore apropriado**
             - Garantir que .env não seja commitado
             - Excluir arquivos de configuração sensíveis
          
          ## 📈 Próximos Passos
          
          - [ ] Corrigir vulnerabilidades críticas (API Keys)
          - [ ] Atualizar dependências vulneráveis
          - [ ] Implementar monitoramento contínuo
          - [ ] Configurar alertas de segurança
          - [ ] Revisar permissões do Firebase
          - [ ] Implementar testes de segurança em cada PR
          - [ ] Adicionar autenticação de dois fatores
          - [ ] Documentar políticas de segurança
          
          ## 📚 Referências
          
          - OWASP Top 10: https://owasp.org/www-project-top-ten/
          - Firebase Security: https://firebase.google.com/docs/rules
          - NPM Security Best Practices: https://docs.npmjs.com/security
          
          ---
          
          **Relatório gerado automaticamente pelo Security CI/CD Pipeline**
          EOF
          
          echo "✅ Relatório consolidado gerado com sucesso!"
      
      - name: Upload relatório final
        uses: actions/upload-artifact@v4
        with:
          name: security-final-report
          path: security-report.md
      
      - name: Comentar PR com resumo
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🔒 **Scan de Segurança Concluído**\n\n✅ Pipeline executado com sucesso!\n\n📊 **Artefatos Gerados:**\n- npm-audit-report\n- eslint-security-report\n- owasp-zap-reports\n- security-final-report\n\nVerifique a aba Actions para baixar os relatórios detalhados.'
            })