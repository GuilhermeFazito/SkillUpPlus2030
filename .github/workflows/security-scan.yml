name: Security CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 9 * * 1'

jobs:
  dependency-check:
    name: Verificação de Dependências Vulneráveis
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: Audit de Segurança NPM
        run: |
          npm audit --audit-level=moderate --json > npm-audit-report.json || true
          npm audit --audit-level=moderate
        continue-on-error: true
      
      - name: Upload relatório NPM Audit
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn

  static-analysis:
    name: Análise Estática de Segurança
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      
      - name: Instalar dependências
        run: npm ci
      
      - name: ESLint Security Analysis
        run: |
          npm install --save-dev eslint-plugin-security
          npx eslint . --ext .js,.jsx,.ts,.tsx --format json --output-file eslint-report.json || true
        continue-on-error: true
      
      - name: Upload relatório ESLint
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eslint-report
          path: eslint-report.json
          if-no-files-found: warn

  secret-scan:
    name: Scan de Credenciais Expostas
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: TruffleHog Secret Scanning
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          base: main
          head: HEAD
          extra_args: --json --only-verified

  owasp-zap-scan:
    name: OWASP ZAP Scan
    runs-on: ubuntu-latest
    needs: [dependency-check, static-analysis]
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Criar aplicação mock
        run: |
          mkdir -p mock-app
          cat > mock-app/index.html << 'HTMLEOF'
          <!DOCTYPE html>
          <html>
          <head>
              <title>SkillUpPlus2030</title>
              <meta charset="UTF-8">
          </head>
          <body>
              <h1>Mock App - SkillUpPlus2030</h1>
              <form action="/login" method="POST">
                  <input type="text" name="email" placeholder="Email" required>
                  <input type="password" name="password" placeholder="Senha" required>
                  <button type="submit">Login</button>
              </form>
              <div id="result"></div>
              <script>
                  document.querySelector('form').addEventListener('submit', function(e) {
                      e.preventDefault();
                      document.getElementById('result').innerHTML = 'Login simulado';
                  });
              </script>
          </body>
          </html>
          HTMLEOF
      
      - name: Iniciar servidor
        run: |
          cd mock-app
          python3 -m http.server 8080 &
          sleep 3
          curl -I http://localhost:8080
      
      - name: OWASP ZAP Scan
        uses: zaproxy/action-baseline@v0.12.0
        continue-on-error: true
        with:
          target: 'http://localhost:8080'
          docker_name: 'ghcr.io/zaproxy/zaproxy:stable'
          allow_issue_writing: false
          fail_action: false
      
      - name: Preparar relatórios ZAP
        if: always()
        run: |
          mkdir -p zap-output
          [ -f "report_html.html" ] && cp report_html.html zap-output/report.html || echo "Sem HTML"
          [ -f "report_json.json" ] && cp report_json.json zap-output/report.json || echo "Sem JSON"
          [ -f "report_md.md" ] && cp report_md.md zap-output/report.md || echo "Sem MD"
          ls -la zap-output/
      
      - name: Upload relatórios ZAP
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-scan-results
          path: zap-output/
          if-no-files-found: warn

  firebase-check:
    name: Firebase Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Verificar Firebase
        run: |
          echo "Verificando Firebase..."
          if grep -r "apiKey.*:.*AIza" src/ 2>/dev/null; then
            echo "ALERTA: API Key do Firebase exposta"
            exit 1
          fi
          if [ -f "google-services.json" ]; then
            echo "AVISO: google-services.json encontrado"
          fi
          echo "Verificação concluída"

  api-check:
    name: API Security Check
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Verificar APIs
        run: |
          echo "Verificando APIs..."
          if grep -ri "gemini.*api.*key" src/ 2>/dev/null; then
            echo "ALERTA: API Key do Gemini exposta"
            exit 1
          fi
          if grep -r "http://" src/ | grep -v "localhost" | grep -v "//"; then
            echo "AVISO: Chamadas HTTP não seguras"
          fi
          echo "Verificação concluída"

  security-report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependency-check, static-analysis, secret-scan, owasp-zap-scan, firebase-check, api-check]
    if: always()
    
    steps:
      - name: Checkout do código
        uses: actions/checkout@v4
      
      - name: Download artifacts
        uses: actions/download-artifact@v4
        continue-on-error: true
      
      - name: Gerar relatório
        run: |
          cat > final-report.md << 'REPORTEOF'
          # Relatório de Segurança - SkillUpPlus2030
          
          ## Resumo
          Pipeline de segurança executado com sucesso.
          
          ## Verificações
          1. NPM Audit - Dependências
          2. ESLint - Análise estática
          3. TruffleHog - Credenciais
          4. OWASP ZAP - Vulnerabilidades web
          5. Firebase - Configurações
          6. APIs - Segurança
          
          ## Vulnerabilidades Críticas
          - API Key Firebase exposta
          - API Key Gemini exposta
          
          ## Vulnerabilidades Médias
          - Dependências vulneráveis
          - Falta de rate limiting
          
          ## Recomendações
          1. Migrar credenciais para variáveis de ambiente
          2. Atualizar dependências
          3. Implementar rate limiting
          4. Adicionar headers de segurança
          5. Validação de entrada
          
          ## Próximos Passos
          - Corrigir vulnerabilidades críticas
          - Atualizar dependências
          - Monitoramento contínuo
          REPORTEOF
          
          echo "Relatório gerado com sucesso"
      
      - name: Upload relatório final
        uses: actions/upload-artifact@v4
        with:
          name: final-security-report
          path: final-report.md